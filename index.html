function calendar(){const first=(new Date(year,month,1).getDay()+6)%7,count=new Date(year,month+1,0).getDate();return `<div class="calendar-toolbar">${btn('‹','prevmonth')}<h2>${year} 年 ${month+1} 月</h2>${btn('›','nextmonth')}</div><div class="calendar-grid">${['一','二','三','四','五','六','日'].map(d=>`<div class="weekday">${d}</div>`).join('')}${'<div class="blank"></div>'.repeat(first)}${Array.from({length:count},(_,i)=>{const d=i+1,n=year===2026&&month===9?(d===15?4:0):0;return `<button class="day ${day===d?'chosen':''}" data-act="day:${d}"><span>${d}</span><small>${n?n+' 位預約':'—'}</small>${n?'<i></i>':''}</button>`}).join('')}</div><p class="sub">點選日期可查看當日安排；日期與預約均為展示資料。</p>`}

function act(a){const [k,v]=a.split(':');if(k==='more'){show('更多工作',`<div class="more-menu">${btn('收支中心','go:finance')}${btn('進貨與庫存','go:stock')}${btn('工作室設定','go:settings')}${btn('本次改版說明','go:design')}</div><p class="sub">全部為示例資料，未連接正式系統。</p>`);return}if(k==='filldue'){$('#paid').value=$('#paid').dataset.due;calc();return}if(k==='go'){go(v);return}if(k==='bookingtab'){tab=v;render()}else if(k==='financetab'){financeTab=v;render()}else if(k==='stocktab'){stockTab=v;render()}else if(k==='settingtab'){settingsTab=v;render()}else if(k==='day'){day=+v;render()}else if(k==='prevmonth'||k==='nextmonth'){month+=k==='prevmonth'?-1:1;if(month<0){month=11;year--}if(month>11){month=0;year++}day=1;render()}else if(k==='filter'){filter=v;render()}else if(k==='newbooking')newBooking();else if(k==='booking'){const b=bookings.find(b=>b.id===v);show('預約詳情 · '+b.id,`<div class="summary-line"><span>客戶</span><strong>${people[b.p].name}</strong></div><div class="summary-line"><span>時間</span><span>2026/10/15 ${b.time}</span></div><div class="summary-line"><span>療程</span><span>${services[b.s][0]}</span></div><div class="summary-line"><span>狀態</span>${pill(b.status)}</div><div class="summary-line"><span>訂金</span><span>${b.deposit?money(b.deposit)+' · 銀行轉帳':'待確認 NT$ 500'}</span></div><div class="form-foot">${btn('改期預覽','reschedule')}${btn('取消處理','cancelbooking')}${btn('服務結帳','clientcheckout:'+b.p,'primary')}</div>${demoFooter}`)}else if(k==='clientcheckout'){checkoutClient=+v;$('#dialog').close();go('checkout')}else if(k==='reschedule')show('改期預覽',`<div class="formgrid">${field('新日期',input('rescheduledate','2026-10-16','date'))}${field('新時段',select('rescheduletime',['09:30','12:00','14:30','17:00']))}</div><p class="sub">既有訂金轉移規則待確認；本版不改動預約。</p>${btn('確認預覽','setting','primary')}`);else if(k==='cancelbooking')show('取消預約・處理示意',`<p>取消、未到店與訂金退還規則尚待 Eva 確認。</p><div class="info">不自動退款、不自動沒收訂金，也不變更預約狀態。</div>${demoFooter}`);else if(k==='newclient')show('新客建檔・示意',`<form data-demo="client"><div class="formgrid">${field('客戶稱呼','<input required placeholder="例如：示例客戶 E">')}${field('LINE 暱稱','<input placeholder="虛構暱稱">')}${field('聯絡方式','<input placeholder="請勿填入真實電話">','full')}${field('服務注意事項','<textarea placeholder="選填・僅使用虛構內容"></textarea>','full')}</div><p class="sub">新增後由正式系統配發編號，避免以暱稱當唯一識別。</p><button class="primary">預覽建檔完成</button></form>`);else if(k==='client')client(v);else if(k==='record')record();else if(k==='profiletab'){const html=v==='history'?historyHTML():v==='consult'?'<p>肌膚類型：混合性（虛構示例）</p><p>服務注意事項：待當次確認</p><p class="sub">客戶自述與服務觀察分開保存，不作診斷。</p>':photosHTML();$('#profilebody').innerHTML=html;$$('#dialog .tabs button').forEach(b=>b.classList.toggle('selected',b.dataset.act===a))}else if(k==='photos')show('照片與同意',photosHTML());else if(k==='expense'||k==='purchase'){show(k==='expense'?'支出登記・示意':'進貨明細・示意',`<form data-demo="expense"><div class="formgrid">${field('日期',input('expdate','2026-10-15','date'))}${field(k==='expense'?'分類':'供應商',k==='expense'?select('exptype',['清潔用品','租金水電','行銷','其他']):input('supplier','示例供應商'))}${field('金額',input('expamount','200','number'))}${field('付款方式',select('exppay',['銀行轉帳','LINE Pay']))}</div>${k==='purchase'?table(['品項','數量','單位'],[['雙重纖維面膜','10','片']])+`<p class="sub">示例進貨明細；正式版本採購、到貨與付款分開處理。</p>`:''}<div class="field"><label>用途／備註<textarea placeholder="僅供示例"></textarea></label></div><button class="primary">預覽登記結果</button></form>`)}else if(k==='deposit'){const b=bookings.find(b=>b.id===v);show('訂金紀錄 · '+v,`<p>${people[b.p].name} · 銀行轉帳 NT$ 500</p><div class="summary-line"><span>關聯預約</span><span>${v}</span></div><div class="summary-line"><span>狀態</span>${pill(b.status==='已完成'?'已抵扣':b.deposit?'已收・待抵扣':'待確認')}</div><p class="sub">正式版需確認款項確實入帳，才能標記已收。此處不提供真實轉帳資訊。</p>${btn('確認收款預覽','setting','primary')}`)}else if(k==='transaction')show('交易明細・示例',table(['項目','金額'],[['水飛梭深層清潔','1,080'],['已收訂金抵扣','500'],['本次尾款・銀行轉帳','580']])+`<p class="sub">退款、退貨與作廢應分開處理並保留原因。</p>${btn('更正／退款預覽','refund')}`);else if(k==='refund')show('更正／退款・示意',`<div class="field"><label>處理類型${select('refundtype',['更正收款方式','退款','交易作廢'])}</label></div><div class="field"><label>原因<textarea placeholder="必須保留處理原因"></textarea></label></div><p class="sub">退款不等於商品退回；正式版另確認退貨是否可入庫。</p>${btn('預覽處理結果','setting','primary')}`);else if(k==='item'){const i=items.find(i=>i[0]===v);show(i[1],table(['庫存資訊','示例內容'],[['管理單位',i[4]],['現有數量',i[3]],['提醒門檻',i[5]],['批號／效期','尚未初始化']])+`<p class="sub">原始採購數量與目前庫存分開。耗材用量確認前不按療程自動扣瓶數。</p>`)}else if(k==='lowstock'){const rows=$$('#content tbody tr');rows.forEach((r,i)=>r.hidden=i!==0);const b=$('[data-act="lowstock"]');b.textContent='顯示全部';b.dataset.act='stocktab:庫存清單'}else if(k==='recordfields')show('紀錄欄位預覽',`<div class="field"><label>欄位名稱<input value="肌膚類型"></label></div><div class="chips">${['油性','乾性','混合性','敏感性'].map(s=>`<label><input type="checkbox">${s}</label>`).join('')}</div><p class="sub">可讀名稱取代 A–S 代碼；歷史紀錄仍保留原意。</p>${btn('預覽設定','setting','primary')}`);else if(k==='editservice')show('療程設定・示意',`<div class="formgrid">${field('名稱',input('editname','水飛梭深層清潔'))}${field('售價',input('editprice','1080','number'))}${field('時長（待確認）',input('editduration','','number'))}</div>${btn('預覽設定','setting','primary')}`);else if(k==='slot')show('時段狀態・示意',`<p>可在正式版本設定單日公休、暫停開放或新增預約。</p>${demoFooter}${btn('新增預約預覽','newbooking')}`);else if(['setting','reconcile','stocktake'].includes(k)){if($('#dialog').open)$('#dialog').close();toast('展示操作完成；未儲存，也未連接正式系統。')}}
function photosHTML(){return '<div class="photo-placeholder">＋<br>服務前／服務後照片位置<br><small>不提供上傳，不收集照片</small></div><label><input type="checkbox"> 同意保存服務紀錄照片（示例）</label><br><label><input type="checkbox"> 另行同意公開宣傳使用（示例）</label>'}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,4000)}
$('#navigation').innerHTML=navs.map(([id,name,icon],i)=>`${i===0?'<small class="nav-label">日常工作</small>':i===4?'<small class="nav-label">營運管理</small>':''}<button data-act="go:${id}"><span class="nav-icon">${icon}</span>${name}</button>`).join('');
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});document.addEventListener('input',e=>{if(e.target.id==='clientsearch')$('#clienttable').innerHTML=clientTable(e.target.value);if(page==='checkout'){if(e.target.id==='saleclient'){checkoutClient=+e.target.value;const b=bookings[checkoutClient];$('#service').value=b.s;$('#deposit').value=b.deposit;$('#paid').value=services[b.s][1]-b.deposit}calc()}});document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='checkoutform'){show('結帳結果・展示',`<p>成交、訂金抵扣與尾款將分開記錄。</p><p class="sub">${people[+$('#saleclient').value].name} · ${services[+$('#service').value][0]}<br>本次支付：${$('#payment').selectedOptions[0].textContent}</p>${$('#summary').innerHTML}<div class="info">沒有建立交易或扣庫存；首頁數字仍為固定示例。</div>`)}else{$('#dialog').close();toast('流程展示完成，沒有新增或保存資料。')}});$('#dialog-close').onclick=()=>$('#dialog').close();page=navs.some(n=>n[0]===location.hash.slice(1))||location.hash==='#design'?location.hash.slice(1):'home';render();
</script></body></html>
